name: Second Polish Verification

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run checks without notification failure
        shell: bash
        run: |
          set +e
          failed=0

          echo '=== LINT ==='
          npm run lint
          code=$?
          echo "LINT_EXIT=$code"
          [ "$code" -ne 0 ] && failed=1

          echo '=== TYPECHECK ==='
          npm run typecheck
          code=$?
          echo "TYPECHECK_EXIT=$code"
          [ "$code" -ne 0 ] && failed=1

          echo '=== TEST ==='
          npm test
          code=$?
          echo "TEST_EXIT=$code"
          [ "$code" -ne 0 ] && failed=1

          echo '=== STATIC BUILD ==='
          npm run build
          code=$?
          echo "BUILD_EXIT=$code"
          [ "$code" -ne 0 ] && failed=1

          echo '=== STATIC ROUTES ==='
          test -f out/index.html
          test -f out/learn/index.html
          test -f out/sepang/index.html
          test -f out/predict/index.html
          test -f out/predict/summary/index.html
          test -f out/leaderboard/index.html
          code=$?
          echo "ROUTES_EXIT=$code"
          [ "$code" -ne 0 ] && failed=1

          echo "POLISH_CHECK_FAILED=$failed"
          exit 0
