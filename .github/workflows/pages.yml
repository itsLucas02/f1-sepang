name: Deploy SEPANG 56 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Keep the public Pages preview pinned to the approved Arena design branch
      # without merging that branch into main.
      - name: Checkout Arena redesign
        uses: actions/checkout@v4
        with:
          ref: arena/01a0606c-f1-sepang

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static export
        run: npm run build

      - name: Verify static output and optimized media
        run: |
          test -f out/index.html
          test -f out/learn/index.html
          test -f out/sepang/index.html
          test -f out/predict/index.html
          test -f out/predict/summary/index.html
          test -f out/leaderboard/index.html
          test -f out/.nojekyll
          test -f out/media/hero/hero-sepang.webp
          test -f out/media/journey/learn.webp
          test -f out/media/journey/sepang.webp
          test -f out/media/journey/predict.webp
          test -f out/media/journey/compete.webp
          test -f out/media/drivers/leclerc.webp
          test -f out/media/drivers/norris.webp
          test -f out/media/prediction/intro.webp
          test -f out/media/sepang/main-straight.webp
          test -f out/media/sepang/t1.webp
          test -f out/media/sepang/t4.webp
          test -f out/media/sepang/t9.webp
          test -f out/media/sepang/t15.webp
          test -f out/media/sepang/overview.webp

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
