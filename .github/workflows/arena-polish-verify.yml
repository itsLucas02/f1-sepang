name: Arena Polish Verification

on:
  push:
    branches:
      - arena/01a0606c-f1-sepang
    paths:
      - .github/workflows/arena-polish-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Arena branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify quality gate
        shell: bash
        run: |
          set +e
          failed=0

          npm run lint
          code=$?
          echo "LINT_EXIT=$code"
          [ "$code" -ne 0 ] && failed=1

          npm run typecheck
          code=$?
          echo "TYPECHECK_EXIT=$code"
          [ "$code" -ne 0 ] && failed=1

          npm test
          code=$?
          echo "TEST_EXIT=$code"
          [ "$code" -ne 0 ] && failed=1

          npm run build
          code=$?
          echo "BUILD_EXIT=$code"
          [ "$code" -ne 0 ] && failed=1

          for file in \
            out/index.html \
            out/sepang/index.html \
            out/predict/index.html \
            out/media/prediction/intro.webp \
            out/media/heritage/petronas-mercedes.webp; do
            test -f "$file" || { echo "MISSING=$file"; failed=1; }
          done

          echo "ARENA_POLISH_CHECK_FAILED=$failed"
          exit 0
